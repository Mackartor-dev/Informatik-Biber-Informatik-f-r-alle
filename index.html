<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biber-Blockwelt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Lernspiel in einer Block-Welt zur Vorbereitung auf den Informatik-Biber, Stufe 5–6. Alle Aufgaben können vorgelesen werden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: eine Spalte wie eine Block-Welt im Querschnitt – Himmel oben, Biome als Schichten, Aufgaben als Bretter-Tafeln. */
:root{
  --sky:#9ED2F4; --sky2:#DDF0FB;
  --panel:#F7F1E0; --panel2:#EDE3C6; --edge:#B39462; --edge2:#8C6E42;
  --ink:#2A241E; --ink2:#5B5145;
  --accent:#E3A21A; --accent-ink:#2E1F00;
  --go:#4E9A33; --go-edge:#2F6B1D; --go-ink:#FFFFFF;
  --crystal:#178FA2; --ok:#2B8636; --bad:#B4371F;
  --focus:#1F5FD1; --mark-s:#FFF0A3; --mark-w:#FFCF33;
  --wire:#8A7A62; --wire-on:#F0AE12; --chip:#E6D9B5; --cell:#E9DFC3; --cell-line:#CDBE98;
  --shade:rgba(0,0,0,.22); --light:rgba(255,255,255,.35);
  --f-body:'Lexend','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pix:'Pixelify Sans','Lexend',system-ui,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#0D1730; --sky2:#1A2948;
  --panel:#242A38; --panel2:#2D3445; --edge:#4B546C; --edge2:#626C88;
  --ink:#EFE9DA; --ink2:#C0B7A4;
  --accent:#F2B835; --accent-ink:#241800;
  --go:#4C9A35; --go-edge:#2C5E1C; --go-ink:#FFFFFF;
  --crystal:#5DD8E8; --ok:#67C873; --bad:#FF8A70;
  --focus:#86B6FF; --mark-s:#4B4322; --mark-w:#8F7612;
  --wire:#6D7489; --wire-on:#F6C445; --chip:#394052; --cell:#2F3647; --cell-line:#454E64;
  --shade:rgba(0,0,0,.4); --light:rgba(255,255,255,.12);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky:#0D1730; --sky2:#1A2948;
  --panel:#242A38; --panel2:#2D3445; --edge:#4B546C; --edge2:#626C88;
  --ink:#EFE9DA; --ink2:#C0B7A4;
  --accent:#F2B835; --accent-ink:#241800;
  --go:#4C9A35; --go-edge:#2C5E1C; --go-ink:#FFFFFF;
  --crystal:#5DD8E8; --ok:#67C873; --bad:#FF8A70;
  --focus:#86B6FF; --mark-s:#4B4322; --mark-w:#8F7612;
  --wire:#6D7489; --wire-on:#F6C445; --chip:#394052; --cell:#2F3647; --cell-line:#454E64;
  --shade:rgba(0,0,0,.4); --light:rgba(255,255,255,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--sky); background-image:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%); background-attachment:fixed;
  color:var(--ink); font-family:var(--f-body); font-size:calc(1.1875rem * var(--scale)); line-height:1.7;
  letter-spacing:.012em; word-spacing:.06em; min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sky)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.b{background-size:100% 100%;image-rendering:pixelated;image-rendering:crisp-edges}
img.px,.px{image-rendering:pixelated}
h1,h2,h3{font-family:var(--f-pix);font-weight:700;line-height:1.2;text-wrap:balance;margin:0;letter-spacing:.02em}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sky);border-bottom:4px solid var(--edge2)}
.top-in{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font-family:var(--f-pix);font-weight:700;font-size:1.35rem;color:var(--ink);text-align:left}
.brand img{width:40px;height:40px}
.top-sp{flex:1}
.gems{display:flex;align-items:center;gap:6px;font-family:var(--f-pix);font-weight:700;font-size:1.15rem;background:var(--panel);border:3px solid var(--edge2);padding:2px 10px;border-radius:3px;font-variant-numeric:tabular-nums}
.gems img{width:22px;height:22px}

/* Bausteine: Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 16px;border:3px solid var(--edge2);border-radius:3px;background:var(--panel2);color:var(--ink);font-weight:500;
  box-shadow:inset -4px -4px 0 var(--shade),inset 4px 4px 0 var(--light);text-align:center;line-height:1.25}
.btn:hover{filter:brightness(1.04)}
.btn:active{box-shadow:inset 4px 4px 0 var(--shade)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.go{background:var(--go);border-color:var(--go-edge);color:var(--go-ink);font-weight:700}
.btn.gold{background:var(--accent);border-color:var(--edge2);color:var(--accent-ink);font-weight:700}
.btn.small{min-height:40px;padding:4px 12px;font-size:.92em}
.btn svg{width:22px;height:22px;flex:none}
.btn.on{background:var(--accent);color:var(--accent-ink)}
.say{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border:3px solid var(--edge2);border-radius:3px;background:var(--panel2);padding:0;
  box-shadow:inset -3px -3px 0 var(--shade),inset 3px 3px 0 var(--light);color:var(--ink)}
.say svg{width:20px;height:20px}
.say.on{background:var(--accent);color:var(--accent-ink)}

/* Tafeln */
.panel{background:var(--panel);border:4px solid var(--edge2);border-radius:4px;box-shadow:0 6px 0 var(--shade);padding:16px}
.panel + .panel{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)}
.readable p{margin:0 0 .55em;max-width:62ch}
.readable p:last-child{margin-bottom:0}
.s{border-radius:3px;transition:background-color .15s;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.reading{background:var(--mark-s)}
.w.now{background:var(--mark-w);border-radius:3px;box-shadow:0 0 0 2px var(--mark-w)}
.q{font-weight:700}
.reading-el{outline:4px solid var(--accent);outline-offset:2px}

/* Startseite */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:20px}
.hero .bix{width:96px;height:96px}
.bubble{position:relative}
.bubble .row{margin-top:12px}
.countdown{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;background:var(--panel2);border:3px dashed var(--edge2);border-radius:4px}
.countdown b{font-family:var(--f-pix);font-size:1.5rem}
.biome{margin-top:28px}
.biome-band{height:28px;border:4px solid var(--edge2);border-bottom:0;border-radius:4px 4px 0 0;background-size:28px 28px;background-repeat:repeat-x;image-rendering:pixelated}
.biome .panel{border-radius:0 0 4px 4px}
.biome-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.biome-head h2{font-size:1.45rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px 12px 60px;min-height:88px;border:3px solid var(--edge2);border-radius:3px;background:var(--panel2);text-align:left;
  box-shadow:inset -4px -4px 0 var(--shade),inset 4px 4px 0 var(--light)}
.tile .num{position:absolute;left:10px;top:12px;width:40px;height:40px;display:grid;place-items:center;font-family:var(--f-pix);font-weight:700;font-size:1.2rem;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.45);border:2px solid rgba(0,0,0,.35)}
.tile .t{font-weight:700;line-height:1.3}
.tile .m{font-size:.85em;color:var(--ink2);display:flex;align-items:center;gap:6px;line-height:1.35}
.tile.done{background:color-mix(in srgb,var(--panel2) 82%,var(--crystal))}
.tile .gem{position:absolute;right:8px;top:8px;width:24px;height:24px}
.pips{display:inline-flex;gap:3px}
.pips i{width:10px;height:10px;background:var(--edge);display:block}
.pips i.f{background:var(--accent);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.probe{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:28px}
.probe img{width:72px;height:72px}
.foot{margin-top:32px;font-size:.85em;color:var(--ink2)}
.foot a{color:inherit}
.ground{height:56px;margin-top:24px;background-size:28px 28px;background-repeat:repeat-x;border-top:0;image-rendering:pixelated}

/* Aufgabe */
.lv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.lv-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.lv-title h1{font-size:1.75rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:3px;background:var(--panel2);border:2px solid var(--edge);font-size:.85em;font-weight:500}
.story{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.story .bix{width:64px;height:64px}
.story .row{margin-top:12px}
.stage{min-width:0}
.stage-in{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.actions .grow{flex:1}
.fb{border-width:4px}
.fb.good{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb h2{font-size:1.4rem;margin-bottom:8px}
.fb.good h2{color:var(--ok)}
.fb.bad h2{color:var(--bad)}
.pro{margin-top:14px;padding:14px;background:var(--panel2);border-radius:3px;border-left:8px solid var(--crystal)}
.pro h3{font-size:1.1rem;margin-bottom:8px}
.hintbox{border-style:dashed}

/* Szenen und Raster */
.scenes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.scene{display:flex;flex-direction:column;align-items:center;gap:6px}
.scene .lbl{font-weight:700;font-size:.9em}
.bgrid{display:grid;gap:0;background:var(--cell);border:3px solid var(--edge2);position:relative}
.bgrid .c{width:var(--cs,40px);height:var(--cs,40px);border-right:1px solid var(--cell-line);border-bottom:1px solid var(--cell-line);position:relative}
.bgrid.flat .c{border:0}
.bgrid .c.b{border-color:transparent}
.groundrow{height:12px;background-size:12px 12px;image-rendering:pixelated}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:3px solid var(--edge2);border-radius:3px;background:var(--panel2);box-shadow:inset -3px -3px 0 var(--shade),inset 3px 3px 0 var(--light);text-align:left;width:100%}
.card .k{font-family:var(--f-pix);font-weight:700;min-width:28px;height:28px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-radius:2px}
.card .tx{flex:1;min-width:0}
.card.used{opacity:.45}
.cardmain{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left;min-width:0;line-height:1.45}
.plan .card{border-style:solid;background:color-mix(in srgb,var(--panel2) 80%,var(--go))}
.plan .card .k{background:var(--go);color:#fff}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols2 > *{min-width:0}
.boxlbl{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.empty{padding:12px;border:3px dashed var(--edge);border-radius:3px;color:var(--ink2);font-size:.9em}

/* Programm-Chips */
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:8px;border:3px dashed var(--edge);border-radius:3px;background:var(--cell)}
.cmd{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:2px solid var(--edge2);border-radius:3px;background:var(--panel);font-size:.9em;font-weight:500}
.cmd small{font-family:var(--f-pix);color:var(--ink2)}
.cmd.now{background:var(--accent);color:var(--accent-ink)}
.cmd svg{width:18px;height:18px}
.kubo{position:absolute;transition:left .28s,top .28s,transform .28s;will-change:transform;pointer-events:none;z-index:3}
.trail{position:absolute;inset:30%;background:var(--accent);opacity:.55;border-radius:2px}
.loopbox{border:4px solid var(--accent);border-radius:4px;padding:10px;background:var(--panel2)}
.loophead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;margin-bottom:8px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper output{min-width:36px;text-align:center;font-family:var(--f-pix);font-size:1.5rem}

/* Lampen */
.lamps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lamp{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px}
.lamp .b{width:60px;height:60px;border:3px solid var(--edge2)}
.lamp.on .b{box-shadow:0 0 18px 4px #FFD54A}
.lamp .v{font-family:var(--f-pix);font-weight:700;font-size:1.3rem}
.lamp .st{font-size:.8em;color:var(--ink2)}
.bignum{font-family:var(--f-pix);font-weight:700;font-size:2.4rem;line-height:1}
.target{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}

/* Paint-Raster mit Codes */
.rle{display:grid;grid-template-columns:auto auto;gap:0 10px;justify-content:center;align-items:center}
.rle .code{font-family:var(--f-pix);font-weight:700;font-size:1.15rem;text-align:right;white-space:nowrap;display:flex;align-items:center;gap:6px;justify-content:flex-end;height:var(--cs,36px)}
.rle .code .say{width:32px;height:32px}
.rle .code .say svg{width:16px;height:16px}
.paint{display:grid;border:3px solid var(--edge2);background:var(--cell)}
.paint button{width:var(--cs,36px);height:var(--cs,36px);border:0;border-right:1px solid var(--cell-line);border-bottom:1px solid var(--cell-line);padding:0;background-color:transparent}
.paint button.sel{outline:3px solid var(--focus);outline-offset:-3px;z-index:2;position:relative}
.counts{font-family:var(--f-pix);font-weight:700;display:grid;place-items:center;font-size:1.05rem}

/* Truhen, Bäume */
.chests{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap}
.chest{flex:1 1 0;max-width:120px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:3px solid var(--edge2);border-radius:3px;background:var(--panel2);box-shadow:inset -3px -3px 0 var(--shade),inset 3px 3px 0 var(--light)}
.chest .b{width:48px;height:48px}
.chest .it{display:flex;align-items:center;gap:4px;font-family:var(--f-pix);font-weight:700;font-size:1.25rem;line-height:1}
.chest .it img{width:20px;height:20px}
.chest.sel{border-color:var(--focus);background:var(--accent);color:var(--accent-ink);transform:translateY(-6px)}
.lr{display:flex;justify-content:space-between;font-size:.85em;color:var(--ink2);font-weight:500}
.trees{display:flex;gap:4px;justify-content:center;align-items:flex-end;flex-wrap:nowrap;padding-top:8px}
.tree{flex:1 1 0;max-width:56px;min-width:0;display:flex;flex-direction:column;align-items:center;background:none;border:3px solid transparent;border-radius:3px;padding:2px 0 4px}
.tree .lv{width:100%;aspect-ratio:1/1;max-width:100%}
.tree .tr{width:44%;}
.tree .n{font-family:var(--f-pix);font-weight:700;font-size:1.2rem;margin-top:4px}
.tree.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,transparent)}
.tree .o{font-family:var(--f-pix);font-size:.85rem;min-height:1.2em;color:var(--ink2)}
.sum{font-family:var(--f-pix);font-weight:700;font-size:1.4rem;text-align:center}

/* Entscheidungsbaum */
.dtable{width:100%;border-collapse:collapse;font-size:.92em}
.dtable th,.dtable td{border:2px solid var(--edge);padding:4px 8px;text-align:left;vertical-align:middle}
.dtable th{background:var(--panel2)}
.dtable td .b{width:26px;height:26px;display:inline-block;vertical-align:middle;margin-right:6px}
.tblwrap{overflow-x:auto}
.dt{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.dq{padding:6px 10px;border:3px solid var(--edge2);background:var(--panel2);border-radius:3px;font-weight:700;text-align:center;font-size:.92em;line-height:1.3;display:flex;align-items:center;gap:6px}
.dq .say{width:30px;height:30px}
.dq .say svg{width:15px;height:15px}
.dbr{display:flex;gap:6px;justify-content:center;width:100%;margin-top:0}
.dbr > .arm{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
.arm .yn{font-size:.8em;font-weight:700;padding:0 6px;border-radius:2px;margin:2px 0}
.arm .yn.ja{color:var(--ok)}
.arm .yn.nein{color:var(--bad)}
.arm .ln{width:3px;height:12px;background:var(--edge2)}
.leaf{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;min-width:62px;border:3px dashed var(--edge2);border-radius:3px;background:var(--cell);font-size:.8em;font-weight:500}
.leaf .b,.leaf .ph{width:34px;height:34px}
.leaf .ph{display:grid;place-items:center;font-family:var(--f-pix);font-size:1.3rem;color:var(--ink2)}
.leaf.filled{border-style:solid}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:3px solid var(--edge2);border-radius:3px;background:var(--panel2);font-size:.85em;font-weight:500;min-width:72px}
.pal .b,.pal img{width:34px;height:34px}
.pal.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--focus)}
.pal.used{opacity:.5}

/* SVG-Bühnen */
.svgbox{width:100%;max-width:520px;margin:0 auto;display:block}
.svgbox text{font-family:var(--f-body);fill:var(--ink)}
.svgbox .lbl{font-size:15px;font-weight:700}
.svgbox .num{font-family:var(--f-pix);font-weight:700}
.svgbox [role=button]{cursor:pointer}
.svgbox [role=button]:focus{outline:none}
.svgbox [role=button]:focus-visible .ring{stroke:var(--focus);stroke-width:4}
.opt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt .btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--focus)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);width:90px;height:90px;border:3px solid var(--edge2);background:#F2F2F2}
.mini i{display:block}
.mini i.d{background:#2B2B2B}
.panes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pane .c.d{background:rgba(30,34,40,.88)!important}
.pane .c.l{background:rgba(205,238,248,.55)}
.pane .c.x{box-shadow:inset 0 0 0 4px var(--accent)}
.flood .c{display:grid;place-items:center}
.flood .c > span{font-family:var(--f-pix);font-weight:700;font-size:.95rem;color:#fff;text-shadow:1px 1px 0 #000;position:relative;z-index:2}
.flood .c.wet::after{content:"";position:absolute;inset:0;background:rgba(40,110,220,.62);z-index:1}
.hut{position:absolute;inset:0;border:0;padding:0;background:transparent;display:block;z-index:2}
.hut img{width:100%;height:100%}
.hut .hn{position:absolute;right:-2px;top:-6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-pix);font-weight:700;font-size:.85rem;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:2px;z-index:3}
.hut.sel{outline:4px solid var(--focus);outline-offset:-2px;z-index:4}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-pix);font-weight:700;font-size:1.3rem}
.bar{flex:1;min-width:120px;height:14px;background:var(--cell);border:3px solid var(--edge2)}
.bar i{display:block;height:100%;background:var(--go)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:36px;height:36px;border:3px solid var(--edge2);background:var(--panel2);font-family:var(--f-pix);font-weight:700;border-radius:3px;padding:0}
.dots button.cur{background:var(--accent);color:var(--accent-ink)}
.dots button.ans{box-shadow:inset 0 -6px 0 var(--go)}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center}
.res .ok{color:var(--ok);font-weight:700}
.res .no{color:var(--bad);font-weight:700}

/* Einstellungen */
.sheet{margin-top:12px}
.set{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:10px 16px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;padding:4px 12px;border:3px solid var(--edge2);background:var(--panel2);border-radius:3px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sw{display:inline-flex;align-items:center;gap:10px}
.sw input{width:26px;height:26px;accent-color:var(--go)}
select{min-height:44px;max-width:100%;padding:4px 8px;border:3px solid var(--edge2);background:var(--panel2);border-radius:3px}
.note{font-size:.88em;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:4px;z-index:50;max-width:calc(100% - 32px);font-weight:500}
.fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fx img{position:absolute;top:-40px;width:28px;height:28px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
.tips li{margin-bottom:.5em}
.tips ul{padding-left:1.2em;margin:.4em 0 0}
.links a{color:var(--crystal);font-weight:700;overflow-wrap:anywhere}

@media (max-width:560px){
  .cols2{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero .bix{width:72px;height:72px}
  .story{grid-template-columns:1fr}
  .story .bix{width:48px;height:48px}
  .set{grid-template-columns:1fr}
  .lv-title h1{font-size:1.45rem}
  .brand span{font-size:1.1rem}
  .tile{min-height:80px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

}

  build(st, api){

LEVELS.push({ id: 15, biome: 'berge', diff: 3, topic: 'Kürzester Weg', title: 'Der schnellste Weg',
  story: ['Bix will mit der Lore vom Dorf zur Burg fahren.', 'An jeder Schiene steht, wie viele Minuten die Fahrt dauert.', 'An jedem Bahnhof kann er sofort umsteigen.'],
  question: 'Tippe die Bahnhöfe der Reihe nach an, damit Bix so schnell wie möglich bei der Burg ist.',
  hint: 'Der Weg mit den wenigsten Bahnhöfen ist nicht immer der schnellste. Rechne für jeden Bahnhof aus, wie schnell man ihn vom Dorf aus erreichen kann.',
  explain: ['Der schnellste Weg geht über Dorf, Mine, Turm, See und Burg. Das dauert 3 plus 2 plus 3 plus 2, also 10 Minuten.', 'Der Weg über die Mühle sieht am Anfang gut aus, dauert aber 12 Minuten.', 'Navigations-Apps lösen diese Aufgabe jeden Tag millionenfach.', 'Ein berühmtes Verfahren dafür heißt Dijkstra-Algorithmus, nach dem Informatiker Edsger Dijkstra.'],
  build(st, api){
    const NAMES = ['Dorf','Mühle','Mine','See','Turm','Wald','Burg'];
    const ICONS = ['hut','planks','coal','water','stone','leaves','bricks'];
    const P = [[45,180],[140,62],[140,298],[320,62],[230,180],[320,298],[398,180]];
    const E = [[0,1,2],[0,2,3],[1,3,8],[1,4,5],[2,4,2],[2,5,7],[3,6,2],[4,3,3],[4,5,4],[5,6,3]];
    const w = (a, b) => { const e = E.find(([x, y]) => (x === a && y === b) || (x === b && y === a)); return e ? e[2] : null; };
    let route = [0];
    const svg = sv('svg', {viewBox: '0 0 440 360', class: 'svgbox'});
    const info = h('p', {class: 'sum', style: 'margin:0', 'aria-live': 'polite'});
    const total = () => route.reduce((t, n, i) => i ? t + w(route[i - 1], n) : 0, 0);
    function inRoute(a, b){ for (let i = 1; i < route.length; i++){ const x = route[i - 1], y = route[i]; if ((x === a && y === b) || (x === b && y === a)) return true; } return false; }
    function draw(){
      svg.replaceChildren();
      E.forEach(([a, b, m]) => {
        const on = inRoute(a, b); const [x1, y1] = P[a], [x2, y2] = P[b];
        svg.append(sv('line', {x1, y1, x2, y2, stroke: '#8A6A44', 'stroke-width': 14, 'stroke-dasharray': '4 7'}), sv('line', {x1, y1, x2, y2, stroke: on ? 'var(--accent)' : 'var(--wire)', 'stroke-width': on ? 7 : 4}));
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        svg.append(sv('circle', {cx: mx, cy: my, r: 16, fill: 'var(--panel)', stroke: on ? 'var(--accent)' : 'var(--edge2)', 'stroke-width': 3}), sv('text', {x: mx, y: my + 7, 'text-anchor': 'middle', class: 'num', 'font-size': 19}, m));
      });
      P.forEach(([x, y], i) => {
        const g = sv('g', {transform: `translate(${x},${y})`}); const inR = route.includes(i);
        g.append(sv('rect', {class: 'ring', x: -27, y: -27, width: 54, height: 54, fill: inR ? 'var(--accent)' : 'var(--edge2)', rx: 3}));
        if (ICONS[i] === 'hut') g.append(sv('image', {href: TEX.grassTop, x: -24, y: -24, width: 48, height: 48, style: 'image-rendering:pixelated'}), sv('image', {href: TEX.hut, x: -20, y: -22, width: 40, height: 40, style: 'image-rendering:pixelated'}));
        else g.append(sv('image', {href: TEX[ICONS[i]], x: -24, y: -24, width: 48, height: 48, style: 'image-rendering:pixelated'}));
        if (i === 6) g.append(sv('rect', {x: 2, y: -40, width: 3, height: 18, fill: '#4A2E17'}), sv('rect', {x: 5, y: -40, width: 14, height: 9, fill: '#C2412D'}));
        g.append(sv('text', {x: 0, y: 46, 'text-anchor': 'middle', class: 'lbl'}, NAMES[i]));
        svgBtn(g, `Bahnhof ${NAMES[i]}`, () => tap(i));
        svg.append(g);
      });
      info.textContent = `Dein Weg: ${route.map(i => NAMES[i]).join(' → ')} · ${total()} Minuten`;
    }
    function tap(i){
      const last = route[route.length - 1];
      if (i === last) return;
      const k = route.indexOf(i); if (k >= 0){ route = route.slice(0, k + 1); draw(); return; }
      if (w(last, i) === null){ toast(`Von ${NAMES[last]} gibt es keine Schiene nach ${NAMES[i]}.`); return; }
      route.push(i); draw();
    }
    draw();
    st.append(svg, info, h('div', {class: 'row', style: 'justify-content:center'},
      h('button', {class: 'btn small', type: 'button', onclick: () => { if (route.length > 1) route.pop(); draw(); }, html: ICON.back + '<span>Einen Bahnhof zurück</span>'}),
      h('button', {class: 'btn small', type: 'button', onclick: () => { route = [0]; draw(); }}, 'Neu anfangen')));
    return {
      async check(){
        if (route[route.length - 1] !== 6) return {ok: false, msg: 'Bix ist noch nicht bei der Burg.'};
        const t = total();
        if (t > 10) return {ok: false, msg: `Dein Weg dauert ${t} Minuten. Es gibt einen schnelleren.`};
        return {ok: true, msg: 'Schneller als 10 Minuten geht es nicht.'};
      },
      solve(){ route = [0,2,4,3,6]; draw(); }
    };
  }
});

async function finishTest(timeUp){
  if (!Test.on) return; endTimer(); Reader.stop();
  const res = [];
  for (const id of Test.list){ let ok = false; try { ok = !!(await Test.inst[id].check({silent: true})).ok; } catch (e) {} res.push({L: byId(id), ok}); }
  const right = res.filter(r => r.ok).length;
  store.probe = {right, total: res.length, at: Date.now()}; save();
  const used = Math.min(Test.dur, Date.now() - Test.start); const mm = Math.round(used / 60000);
  const per = [1,2,3].map(d => { const a = res.filter(r => r.L.diff === d); return `${DIFF[d]}: ${a.filter(r => r.ok).length} von ${a.length}`; });
  const t = h('div', {class: 'readable'}, para([(timeUp ? 'Die Zeit ist um. ' : '') + `Du hast ${right} von ${res.length} Aufgaben richtig.`, `Davon ${per.join(', ')}.`, `Du hast ungefähr ${plural(mm, 'Minute', 'Minuten')} gebraucht.`, right >= 9 ? 'Super! Du bist bestens vorbereitet.' : right >= 6 ? 'Gut gemacht! Übe die anderen Aufgaben noch einmal in Ruhe.' : 'Ein guter Anfang. Übe die Aufgaben in Ruhe und mach den Probe-Biber dann noch einmal.']));
  view.replaceChildren(
    h('div', {class: 'lv-title', style: 'margin-top:16px'}, h('h1', {}, 'Dein Probe-Biber')),
    h('section', {class: 'panel', style: 'margin-top:14px'}, t, h('div', {class: 'row', style: 'margin-top:10px'}, readBtn(() => [t]))),
    h('section', {class: 'panel', style: 'margin-top:14px'}, h('div', {class: 'res'}, ...res.flatMap(r => [h('span', {class: r.ok ? 'ok' : 'no'}, r.ok ? 'richtig' : 'falsch'), h('span', {}, `${r.L.id}. ${r.L.title} (${DIFF[r.L.diff]})`), h('button', {class: 'btn small', type: 'button', onclick: () => nav('aufgabe-' + r.L.id)}, 'Üben')]))),
    h('div', {class: 'row', style: 'margin-top:14px'}, h('button', {class: 'btn go', type: 'button', onclick: () => nav('probe')}, 'Noch einmal'), h('button', {class: 'btn', type: 'button', onclick: () => nav('welt')}, 'Zur Weltkarte')));
  if (store.settings.auto) Reader.read([t]);
}

  const voiceSel = h('select', {id: 'voice-sel', 'aria-label': 'Stimme'});

    voiceSel.replaceChildren();
    if (!Reader.voices.length){ voiceSel.append(h('option', {value: ''}, Reader.ok ? 'Standard-Stimme' : 'Vorlesen nicht verfügbar')); return; }
    Reader.voices.forEach(v => voiceSel.append(h('option', {value: v.voiceURI, selected: Reader.voice && v.voiceURI === Reader.voice.voiceURI ? true : null}, v.name)));
  };
  voiceSel.addEventListener('change', () => { store.settings.voice = voiceSel.value; Reader.pick(); save(); });
  renderVoices();
  const auto = h('input', {type: 'checkbox', id: 'auto-read'}); auto.checked = !!store.settings.auto; auto.addEventListener('change', () => { store.settings.auto = auto.checked; save(); });
  const snd = h('input', {type: 'checkbox', id: 'sound-on'}); snd.checked = !!store.settings.sound; snd.addEventListener('change', () => { store.settings.sound = snd.checked; save(); });
  const resetArea = h('div');

  }}, 'Fortschritt zurücksetzen');

      h('span', {style: 'font-weight:700'}, 'Stimme'), h('div', {class: 'row'}, voiceSel, h('button', {class: 'btn small', type: 'button', onclick: e => Reader.read(['Hallo! Ich bin Bix. So klinge ich beim Vorlesen.'], null)}, 'Probe hören')),
      h('span', {style: 'font-weight:700'}, 'Schriftgröße'), seg([[1, 'Normal'], [1.15, 'Groß'], [1.3, 'Sehr groß']], () => store.settings.scale, v => { store.settings.scale = v; applyScale(); }),
      h('span', {style: 'font-weight:700'}, 'Töne'), h('label', {class: 'sw', for: 'sound-on'}, snd, 'Kurzer Ton bei richtiger Lösung'),

/* Test-Hilfe für die Entwicklung */
window.__biber = {
  LEVELS,
  async verify(){
    const out = [];
    for (const L of LEVELS){
      for (const test of [false, true]){
        const box = document.createElement('div'); const inst = L.build(box, {test});
        let neg; try { neg = await inst.check({silent: true}); } catch (e) { neg = {err: String(e)}; }
        let pos = null;
        for (let k = 0; k < 5; k++){ inst.solve(); try { pos = await inst.check({silent: true}); } catch (e) { pos = {err: String(e)}; break; } if (pos.ok || !pos.progress) break; }
        out.push({id: L.id, test, negOk: !!(neg && neg.ok), posOk: !!(pos && pos.ok), err: (neg && neg.err) || (pos && pos.err) || null});
      }
    }
    return out;
  }
};
})();
